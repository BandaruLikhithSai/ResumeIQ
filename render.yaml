services:
  # ── Backend API ──────────────────────────────────────────────
  - type: web
    name: resumeiq-api
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --workers 2 --threads 2 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health

    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.12.11"

      - key: SECRET_KEY
        generateValue: true

      - key: JWT_SECRET_KEY
        generateValue: true

      - key: DATABASE_URL
        fromDatabase:
          name: resumeiq-db
          property: connectionString

      - key: FRONTEND_URL
        value: https://resumeiq-web.onrender.com

      - key: UPLOAD_FOLDER
        value: uploads

      - key: MAX_CONTENT_LENGTH
        value: "16777216"

      - key: WEIGHT_TFIDF
        value: "0.25"

      - key: WEIGHT_SEMANTIC
        value: "0.30"

      - key: WEIGHT_KG
        value: "0.25"

      - key: WEIGHT_EXPERIENCE
        value: "0.20"

      - key: SCORE_EXCELLENT
        value: "85"

      - key: SCORE_STRONG
        value: "70"

      - key: SCORE_MODERATE
        value: "50"

      - key: SCORE_WEAK
        value: "30"

  # ── Frontend ─────────────────────────────────────────────────
  - type: web
    name: resumeiq-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true

    headers:
      - path: /*
        name: Cache-Control
        value: no-cache

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      - key: VITE_API_URL
        value: https://resumeiq-api.onrender.com

# ── PostgreSQL Database ────────────────────────────────────────
databases:
  - name: resumeiq-db
    databaseName: resumeiq
    plan: free
    region: singapore